<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <defs>
    <filter id="bristles" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .12" numOctaves="4" seed="38" stitchTiles="stitch" result="grain"/>
      <feDiffuseLighting in="grain" surfaceScale="3" diffuseConstant=".95" lighting-color="#ffffff" result="ridges"><feDistantLight azimuth="230" elevation="45"/></feDiffuseLighting>
    </filter>
    <filter id="rough-edges" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .055" numOctaves="3" seed="12" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="24" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="#888"/>
  <g fill="none" stroke-linecap="round" filter="url(#rough-edges)" opacity=".32">
    <path d="M-80 85Q145 5 390 80T1010 32" stroke="#d4d4d4" stroke-width="66"/>
    <path d="M-60 230Q215 150 496 191T1030 140" stroke="#484848" stroke-width="88"/>
    <path d="M-75 320Q170 235 367 294T1040 254" stroke="#c8c8c8" stroke-width="44"/>
    <path d="M-85 454Q205 361 505 425T1055 385" stroke="#555" stroke-width="76"/>
    <path d="M-65 543Q255 470 485 528T1040 499" stroke="#d8d8d8" stroke-width="55"/>
    <path d="M-80 675Q186 605 438 644T1045 630" stroke="#505050" stroke-width="63"/>
  </g>
  <rect width="960" height="720" filter="url(#bristles)" opacity=".58" style="mix-blend-mode:soft-light"/>
</svg>
